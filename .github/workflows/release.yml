name: Build & Release OpenCode Helper

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (Ubuntu) Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libsqlite3-dev zip imagemagick

      - name: Build & Package Linux Artifacts
        run: |
          chmod +x scripts/package-release.sh install.sh
          ./scripts/package-release.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/opencode-helper-linux-x86_64-portable.tar.gz
            dist/opencode-helper-linux-x86_64-installer.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows Packages
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile Native Windows WPF Binary
        shell: powershell
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { $csc = "C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe" }
          $wpfDir = [System.IO.Path]::GetDirectoryName($csc) + "\WPF"
          
          Write-Host "Compiling OpenCodeHelper.cs with csc.exe..."
          & $csc /nologo /target:winexe /out:"OpenCodeHelper.exe" /platform:anycpu /win32icon:"app.ico" `
            /lib:"$wpfDir" `
            /r:PresentationFramework.dll `
            /r:PresentationCore.dll `
            /r:WindowsBase.dll `
            /r:System.Xaml.dll `
            /r:System.dll `
            /r:System.Core.dll `
            /r:System.Net.Http.dll `
            /r:System.Web.Extensions.dll `
            /r:System.Windows.Forms.dll `
            /r:System.Drawing.dll `
            "OpenCodeHelper.cs"
            
          if (-not (Test-Path "OpenCodeHelper.exe")) {
            throw "Compilation failed: OpenCodeHelper.exe not found!"
          }
          Write-Host "OpenCodeHelper.exe compiled successfully!"

      - name: Package Windows Portable & Installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "dist\win-portable" -Force | Out-Null
          New-Item -ItemType Directory -Path "dist\win-installer" -Force | Out-Null

          $commonFiles = @(
            "OpenCodeHelper.exe",
            "OpenCodeHelper.bat",
            "OpenCodeHelper.vbs",
            "OpenCodeHelper.ps1",
            "OpenCodeHelper.cs",
            "build.bat",
            "app.ico",
            "README.md"
          )

          foreach ($f in $commonFiles) {
            if (Test-Path $f) {
              Copy-Item $f "dist\win-portable\" -Force
              Copy-Item $f "dist\win-installer\" -Force
            }
          }

          if (Test-Path "install.ps1") {
            Copy-Item "install.ps1" "dist\win-installer\" -Force
          }

          Compress-Archive -Path "dist\win-portable\*" -DestinationPath "dist\OpenCodeHelper-Windows-Portable.zip" -Force
          Compress-Archive -Path "dist\win-installer\*" -DestinationPath "dist\OpenCodeHelper-Windows-Installer.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/OpenCodeHelper-Windows-Portable.zip
            dist/OpenCodeHelper-Windows-Installer.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: release-assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: release-assets

      - name: Determine Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: OpenCode Helper ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/opencode-helper-linux-x86_64-portable.tar.gz
            release-assets/opencode-helper-linux-x86_64-installer.tar.gz
            release-assets/OpenCodeHelper-Windows-Portable.zip
            release-assets/OpenCodeHelper-Windows-Installer.zip
